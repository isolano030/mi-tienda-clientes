<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mi Tienda · Panel de ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#15243a;--navy2:#213652;--ink:#172033;--muted:#718096;--bg:#f4f6f9;--card:#fff;--line:#e6ebf1;--green:#16805d;--greenbg:#e8f5ef;--gold:#b7791e;--goldbg:#fff5e3;--red:#b34b4b;--redbg:#fdeeee;--shadow:0 6px 22px rgba(19,37,61,.05);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(135deg,#14243a,#274b69)}.login-card{background:white;width:min(430px,100%);border-radius:20px;padding:32px;box-shadow:0 24px 70px #09172755}.brand{display:flex;align-items:center;gap:12px;font-family:Manrope,sans-serif;font-weight:800;font-size:20px}.logo{width:42px;height:42px;background:var(--navy);color:white;border-radius:13px;display:grid;place-items:center;font-weight:800}.login-card h1{font-family:Manrope,sans-serif;margin:28px 0 8px;font-size:26px}.login-card p{color:var(--muted);margin-top:0}.field{margin:16px 0}.field label{display:block;font-weight:600;font-size:13px;margin-bottom:7px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:white;outline:none}.field input:focus,.field select:focus{border-color:#6683a4;box-shadow:0 0 0 3px #6683a422}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.btn-primary{background:var(--navy);color:white}.btn-primary:hover{background:var(--navy2)}.btn-light{background:#edf1f6;color:var(--navy)}.btn-danger{background:var(--redbg);color:var(--red)}.full{width:100%}.error{color:var(--red);font-size:13px;margin-top:10px}.shell{display:flex;min-height:100vh}.sidebar{width:238px;background:var(--navy);color:white;padding:22px 15px;display:flex;flex-direction:column;flex-shrink:0}.sidebar .brand{padding:4px 10px 25px}.sidebar .logo{background:#365270}.navlabel{font-size:11px;letter-spacing:1.1px;color:#92a4b9;margin:18px 12px 8px}.navbtn{background:transparent;color:#c9d5e3;border:0;text-align:left;padding:12px;border-radius:9px;margin:2px 0;display:flex;gap:11px;align-items:center;font-weight:600}.navbtn.active,.navbtn:hover{background:#ffffff17;color:white}.sidebottom{margin-top:auto;border-top:1px solid #ffffff1c;padding-top:16px}.main{flex:1;min-width:0;padding:28px 34px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;gap:12px}.topbar h1{font-family:Manrope,sans-serif;margin:0;font-size:25px}.topbar p{color:var(--muted);margin:5px 0 0}.userpill{background:white;border:1px solid var(--line);padding:8px 12px;border-radius:999px;color:#526176;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-family:Manrope,sans-serif;font-size:25px;font-weight:800;margin-top:10px}.stat .hint{font-size:12px;color:var(--muted);margin-top:5px}.content-card{background:white;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.cardhead h2{font-family:Manrope,sans-serif;font-size:17px;margin:0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{border:1px solid var(--line);padding:10px 12px;border-radius:9px;min-width:200px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#78879b;font-size:12px;font-weight:600;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0f2f5;font-size:14px}tr:last-child td{border-bottom:0}.namecell{font-weight:700}.small{font-size:12px;color:var(--muted);margin-top:3px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}.badge.green{color:var(--green);background:var(--greenbg)}.badge.gold{color:var(--gold);background:var(--goldbg)}.badge.red{color:var(--red);background:var(--redbg)}.badge.gray{color:#627187;background:#edf1f5}.empty{padding:34px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formgrid .field{margin:4px 0}.formgrid .span2{grid-column:span 2}.modalback{position:fixed;inset:0;background:#0b142b78;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(540px,100%);background:white;border-radius:16px;padding:24px;max-height:90vh;overflow:auto}.modal h2{font-family:Manrope,sans-serif;margin:0 0 18px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.toast{position:fixed;right:20px;bottom:20px;background:#15243a;color:white;padding:13px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.clienthero{display:flex;gap:16px;align-items:center;margin-bottom:22px}.avatar{width:48px;height:48px;border-radius:15px;background:#e8edf5;color:#244264;display:grid;place-items:center;font-weight:800;font-size:18px}.clientgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.clientgrid .stat .value{font-size:23px}.hide{display:none!important}.mobiletop{display:none}
@media(max-width:900px){.sidebar{width:190px}.main{padding:23px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.shell{display:block}.sidebar{width:auto;min-height:auto;padding:12px 12px;flex-direction:row;align-items:center;gap:6px}.sidebar .brand{padding:0 5px 0;font-size:16px}.sidebar .logo{width:35px;height:35px}.navlabel,.sidebottom{display:none}.navbtn{font-size:0;padding:10px;margin-left:auto}.navbtn span{font-size:18px}.sidebar .navbtn:nth-of-type(2){margin-left:auto}.main{padding:18px 14px}.topbar{align-items:flex-start}.topbar h1{font-size:22px}.stats{gap:9px}.stat{padding:14px}.stat .value{font-size:21px}.content-card{padding:15px}.formgrid{grid-template-columns:1fr}.formgrid .span2{grid-column:span 1}.toolbar input{min-width:0;width:100%}.clientgrid{grid-template-columns:1fr}.login-card{padding:25px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Add your Supabase project URL and anon/public key in these two values after setup.
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
const configured = !SUPABASE_URL.startsWith('YOUR_') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const app = document.getElementById('app');
let currentUser = null, profile = null, customerRecord = null;
const money = n => '$' + Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const datefmt = s => s ? new Date(s+'T12:00:00').toLocaleDateString('es-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function brand(){return `<div class="brand"><div class="logo">MS</div><span>Mi Tienda</span></div>`}
function login(){app.innerHTML=`<div class="login-wrap"><div class="login-card">${brand()}<h1>Bienvenido</h1><p>Ingresá a tu cuenta para consultar tus compras y pagos.</p><form id="loginform"><div class="field"><label>Correo electrónico</label><input id="email" type="email" placeholder="tu@email.com" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="••••••••" required></div><button class="btn btn-primary full" type="submit">Ingresar</button><div id="loginerr" class="error"></div></form>${!configured?'<div class="error" style="margin-top:15px">Falta configurar Supabase. Seguí el README para conectar el sistema.</div>':''}</div></div>`;
 document.getElementById('loginform').onsubmit=async e=>{e.preventDefault();if(!sb){toast('Primero configurá Supabase siguiendo el README');return}let {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){loginerr.textContent=error.message;return}await loadApp()};
}
async function loadApp(){const {data:{user}}=await sb.auth.getUser();if(!user){login();return}currentUser=user;const {data:p,error}=await sb.from('customer_profiles').select('role,customer_id').eq('user_id',user.id).single();if(error||!p){await sb.auth.signOut();login();toast('No se encontró perfil asignado');return}profile=p;if(p.role==='admin')adminShell();else {const {data:c}=await sb.from('customers').select('*').eq('id',p.customer_id).single();customerRecord=c;clientShell()}}
function adminShell(){app.innerHTML=`<div class="shell"><aside class="sidebar">${brand()}<div class="navlabel">GESTIÓN</div><button class="navbtn active" data-page="overview"><span>▦</span> Resumen</button><button class="navbtn" data-page="clients"><span>♙</span> Clientes</button><button class="navbtn" data-page="orders"><span>▣</span> Pedidos</button><button class="navbtn" data-page="payments"><span>＄</span> Abonos</button><div class="sidebottom"><button class="navbtn" id="logout"><span>↪</span> Cerrar sesión</button></div></aside><main class="main"><header class="topbar"><div><h1 id="page-title">Resumen</h1><p id="page-sub">Control general de tu negocio</p></div><div class="userpill">Administrador</div></header><section id="view"></section></main></div>`;
 document.querySelectorAll('.navbtn[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');showPage(b.dataset.page)});document.getElementById('logout').onclick=logout;showPage('overview')}
async function showPage(page){let v=document.getElementById('view');document.getElementById('page-title').textContent=({overview:'Resumen',clients:'Clientes',orders:'Pedidos',payments:'Abonos'})[page];document.getElementById('page-sub').textContent=({overview:'Control general de tu negocio',clients:'Administrá tus clientes y sus cuentas',orders:'Compras y productos registrados',payments:'Historial de pagos recibidos'})[page];
 if(page==='overview'){let [cs,os,ps]=await Promise.all([sb.from('customers').select('*'),sb.from('orders').select('total_amount'),sb.from('payments').select('amount')]);let customers=cs.data||[],orders=os.data||[],payments=ps.data||[];let total=orders.reduce((s,x)=>s+Number(x.total_amount||0),0),paid=payments.reduce((s,x)=>s+Number(x.amount||0),0);v.innerHTML=`<div class="stats"><div class="stat"><div class="label">Clientes</div><div class="value">${customers.length}</div><div class="hint">Clientes registrados</div></div><div class="stat"><div class="label">Ventas acumuladas</div><div class="value">${money(total)}</div><div class="hint">Total de pedidos</div></div><div class="stat"><div class="label">Abonos recibidos</div><div class="value">${money(paid)}</div><div class="hint">Pagos registrados</div></div><div class="stat"><div class="label">Por cobrar</div><div class="value">${money(total-paid)}</div><div class="hint">Saldo pendiente</div></div></div><div class="content-card"><div class="cardhead"><h2>Accesos rápidos</h2></div><div class="toolbar"><button class="btn btn-primary" onclick="modalCustomer()">＋ Agregar cliente</button><button class="btn btn-light" onclick="modalOrder()">＋ Registrar compra</button><button class="btn btn-light" onclick="modalPayment()">＋ Registrar abono</button></div></div>`}
 if(page==='clients'){let {data:cs}=await sb.from('customers').select('*').order('name');v.innerHTML=`<div class="content-card"><div class="cardhead"><h2>Clientes</h2><button class="btn btn-primary" onclick="modalCustomer()">＋ Nuevo cliente</button></div><div class="toolbar" style="margin-bottom:15px"><input id="clientsearch" placeholder="Buscar por nombre o correo…" oninput="filterClients()"></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Correo</th><th>Teléfono</th><th></th></tr></thead><tbody id="clientrows">${(cs||[]).map(c=>`<tr data-search="${esc((c.name+' '+(c.email||'')).toLowerCase())}"><td class="namecell">${esc(c.name)}</td><td>${esc(c.email||'—')}</td><td>${esc(c.phone||'—')}</td><td><button class="btn btn-light" onclick="viewClient('${c.id}')">Ver cuenta</button></td></tr>`).join('')}</tbody></table></div>${!cs?.length?'<div class="empty">Todavía no hay clientes.</div>':''}</div>`}
 if(page==='orders'){let {data:orders}=await sb.from('orders').select('*,customers(name),order_items(*)').order('order_date',{ascending:false});v.innerHTML=`<div class="content-card"><div class="cardhead"><h2>Pedidos y compras</h2><button class="btn btn-primary" onclick="modalOrder()">＋ Registrar compra</button></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Estado</th></tr></thead><tbody>${(orders||[]).map(o=>`<tr><td>${datefmt(o.order_date)}</td><td class="namecell">${esc(o.customers?.name||'—')}</td><td>${esc(o.order_items?.map(i=>i.product_name).join(', ')||'—')}</td><td>${o.order_items?.reduce((a,i)=>a+Number(i.quantity),0)||'—'}</td><td>${money(o.total_amount)}</td><td><span class="badge ${o.status==='delivered'?'green':o.status==='shipped'?'gold':'gray'}">${statusText(o.status)}</span></td></tr>`).join('')}</tbody></table></div>${!orders?.length?'<div class="empty">No hay pedidos registrados.</div>':''}</div>`}
 if(page==='payments'){let {data:ps}=await sb.from('payments').select('*,customers(name)').order('payment_date',{ascending:false});v.innerHTML=`<div class="content-card"><div class="cardhead"><h2>Abonos recibidos</h2><button class="btn btn-primary" onclick="modalPayment()">＋ Registrar abono</button></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Monto</th><th>Método</th><th>Nota</th></tr></thead><tbody>${(ps||[]).map(p=>`<tr><td>${datefmt(p.payment_date)}</td><td class="namecell">${esc(p.customers?.name||'—')}</td><td>${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.note||'—')}</td></tr>`).join('')}</tbody></table></div>${!ps?.length?'<div class="empty">No hay abonos registrados.</div>':''}</div>`}
}
function statusText(s){return ({pending:'Pendiente',purchased:'Comprado',shipped:'En tránsito',delivered:'Entregado'})[s]||s||'Pendiente'}
function filterClients(){let q=document.getElementById('clientsearch').value.toLowerCase();document.querySelectorAll('#clientrows tr').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function modal(title,body,onSave){let back=document.createElement('div');back.className='modalback';back.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="modalactions"><button class="btn btn-light" id="cancel">Cancelar</button><button class="btn btn-primary" id="save">Guardar</button></div></div>`;document.body.appendChild(back);back.querySelector('#cancel').onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};back.querySelector('#save').onclick=async()=>{let result=await onSave(back);if(result!==false)back.remove()};return back}
async function modalCustomer(){modal('Nuevo cliente',`<div class="field"><label>Nombre completo</label><input id="cname" required placeholder="Nombre del cliente"></div><div class="field"><label>Email (para crear su acceso después)</label><input id="cemail" type="email" placeholder="cliente@email.com"></div><div class="field"><label>Teléfono</label><input id="cphone" placeholder="Teléfono / WhatsApp"></div><div class="field"><label>Notas</label><input id="cnote" placeholder="Opcional"></div>`,async m=>{let name=m.querySelector('#cname').value.trim();if(!name){toast('Ingresá un nombre');return false}let {error}=await sb.from('customers').insert({name,email:m.querySelector('#cemail').value,phone:m.querySelector('#cphone').value,note:m.querySelector('#cnote').value});if(error){toast(error.message);return false}toast('Cliente agregado');showPage('clients')})}
async function getCustomers(){let {data}=await sb.from('customers').select('id,name').order('name');return data||[]}
async function modalOrder(){let cs=await getCustomers();if(!cs.length){toast('Primero agregá un cliente');return}modal('Registrar compra',`<div class="field"><label>Cliente</label><select id="ocustomer">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Producto</label><input id="oproduct" placeholder="Ej. Nike Air Max"></div><div class="field"><label>Cantidad</label><input id="oqty" type="number" min="1" value="1"></div><div class="field"><label>Precio unitario (USD)</label><input id="oprice" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field"><label>Fecha</label><input id="odate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Estado</label><select id="ostatus"><option value="pending">Pendiente</option><option value="purchased">Comprado</option><option value="shipped">En tránsito</option><option value="delivered">Entregado</option></select></div><div class="field"><label>Notas</label><input id="onote" placeholder="Talla, color, detalles…"></div>`,async m=>{let prod=m.querySelector('#oproduct').value.trim(),qty=Number(m.querySelector('#oqty').value),price=Number(m.querySelector('#oprice').value);if(!prod||!qty||price<0){toast('Completá producto, cantidad y precio');return false}let total=qty*price;let {data:o,error}=await sb.from('orders').insert({customer_id:m.querySelector('#ocustomer').value,order_date:m.querySelector('#odate').value,status:m.querySelector('#ostatus').value,total_amount:total,note:m.querySelector('#onote').value}).select().single();if(error){toast(error.message);return false}let {error:ei}=await sb.from('order_items').insert({order_id:o.id,product_name:prod,quantity:qty,unit_price:price,line_total:total});if(ei){toast(ei.message);return false}toast('Compra registrada');showPage('orders')})}
async function modalPayment(){let cs=await getCustomers();if(!cs.length){toast('Primero agregá un cliente');return}modal('Registrar abono',`<div class="field"><label>Cliente</label><select id="pcustomer">${cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Monto (USD)</label><input id="pamount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Fecha de pago</label><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Método</label><select id="pmethod"><option>Cash</option><option>Sinpe / transferencia</option><option>PayPal</option><option>Otro</option></select></div><div class="field"><label>Nota</label><input id="pnote" placeholder="Referencia, detalle…"></div>`,async m=>{let amount=Number(m.querySelector('#pamount').value);if(!amount||amount<=0){toast('Ingresá un monto válido');return false}let {error}=await sb.from('payments').insert({customer_id:m.querySelector('#pcustomer').value,amount,payment_date:m.querySelector('#pdate').value,method:m.querySelector('#pmethod').value,note:m.querySelector('#pnote').value});if(error){toast(error.message);return false}toast('Abono registrado');showPage('payments')})}
async function viewClient(id){let {data:c}=await sb.from('customers').select('*').eq('id',id).single();let {data:orders}=await sb.from('orders').select('*,order_items(*)').eq('customer_id',id).order('order_date',{ascending:false});let {data:payments}=await sb.from('payments').select('*').eq('customer_id',id).order('payment_date',{ascending:false});let total=(orders||[]).reduce((a,o)=>a+Number(o.total_amount),0),paid=(payments||[]).reduce((a,p)=>a+Number(p.amount),0);modal('Cuenta de '+c.name,`<div class="clientgrid"><div class="stat"><div class="label">Compras</div><div class="value">${money(total)}</div></div><div class="stat"><div class="label">Abonos</div><div class="value">${money(paid)}</div></div><div class="stat"><div class="label">Debe</div><div class="value">${money(total-paid)}</div></div></div><h3>Productos</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Estado</th></tr></thead><tbody>${(orders||[]).flatMap(o=>(o.order_items||[]).map(i=>`<tr><td>${datefmt(o.order_date)}</td><td>${esc(i.product_name)}</td><td>${i.quantity}</td><td>${money(i.line_total)}</td><td>${statusText(o.status)}</td></tr>`)).join('')}</tbody></table></div><h3>Abonos</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Método</th></tr></thead><tbody>${(payments||[]).map(p=>`<tr><td>${datefmt(p.payment_date)}</td><td>${money(p.amount)}</td><td>${esc(p.method||'—')}</td></tr>`).join('')}</tbody></table></div>`,async()=>true)}
function clientShell(){app.innerHTML=`<div class="shell"><aside class="sidebar">${brand()}<div class="navlabel">MI CUENTA</div><button class="navbtn active"><span>▦</span> Resumen</button><div class="sidebottom"><button class="navbtn" id="logout"><span>↪</span> Cerrar sesión</button></div></aside><main class="main"><header class="topbar"><div><h1>Mi cuenta</h1><p>Resumen de tus compras y pagos</p></div><div class="userpill">Portal de cliente</div></header><section id="view"></section></main></div>`;document.getElementById('logout').onclick=logout;showClientPage()}
async function showClientPage(){let id=profile.customer_id;let [ordersQ,payQ]=await Promise.all([sb.from('orders').select('*,order_items(*)').eq('customer_id',id).order('order_date',{ascending:false}),sb.from('payments').select('*').eq('customer_id',id).order('payment_date',{ascending:false})]);let orders=ordersQ.data||[],payments=payQ.data||[];let total=orders.reduce((a,o)=>a+Number(o.total_amount),0),paid=payments.reduce((a,p)=>a+Number(p.amount),0);document.getElementById('view').innerHTML=`<div class="clienthero"><div class="avatar">${esc((customerRecord.name||'C').slice(0,1).toUpperCase())}</div><div><h2 style="margin:0">Hola, ${esc(customerRecord.name.split(' ')[0])}</h2><div class="small">Aquí podés revisar tu cuenta y tus pedidos.</div></div></div><div class="clientgrid"><div class="stat"><div class="label">Compras totales</div><div class="value">${money(total)}</div></div><div class="stat"><div class="label">Abonos realizados</div><div class="value">${money(paid)}</div></div><div class="stat"><div class="label">Saldo pendiente</div><div class="value" style="color:${total-paid>0?'#b7791e':'#16805d'}">${money(total-paid)}</div></div></div><div class="content-card"><div class="cardhead"><h2>Mis productos</h2></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>Estado</th></tr></thead><tbody>${orders.flatMap(o=>(o.order_items||[]).map(i=>`<tr><td>${datefmt(o.order_date)}</td><td class="namecell">${esc(i.product_name)}</td><td>${i.quantity}</td><td>${money(i.line_total)}</td><td><span class="badge ${o.status==='delivered'?'green':o.status==='shipped'?'gold':'gray'}">${statusText(o.status)}</span></td></tr>`)).join('')}</tbody></table>${!orders.length?'<div class="empty">Todavía no tenés compras registradas.</div>':''}</div></div><div class="content-card"><div class="cardhead"><h2>Historial de abonos</h2></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Método</th><th>Nota</th></tr></thead><tbody>${payments.map(p=>`<tr><td>${datefmt(p.payment_date)}</td><td class="namecell">${money(p.amount)}</td><td>${esc(p.method||'—')}</td><td>${esc(p.note||'—')}</td></tr>`).join('')}</tbody></table>${!payments.length?'<div class="empty">Todavía no tenés abonos registrados.</div>':''}</div></div>`}
async function logout(){if(sb)await sb.auth.signOut();currentUser=null;profile=null;login()}
if(configured){sb.auth.getSession().then(({data})=>data.session?loadApp():login());sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')login()})}else login();
</script>
</body>
